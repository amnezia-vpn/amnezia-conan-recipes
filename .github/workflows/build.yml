name: build
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: upload
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }

      - run: pip install conan==2.33.0

      - name: Set up remote
        shell: bash
        run: |
          conan remote add recipes "${{ vars.CONAN_REMOTE_URL }}"
          conan remote login recipes "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

      - name: Upload recipes
        shell: bash
        run: python export.py --upload recipes --verbose
